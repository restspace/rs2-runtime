[workspace]
members = ["rs2-core", "rs2-server", "rs2-cli"]
exclude = ["conformance/echo-guest"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Open-source under AGPL-3.0; a commercial license is available for closed-source
# embedding or hosted offerings. See LICENSING.md.
license = "AGPL-3.0-only"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
http = "1"
jsonschema = { version = "0.33", default-features = false }
percent-encoding = "2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
uuid = { version = "1", features = ["v4"] }
