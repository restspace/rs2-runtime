name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --all -- --check
      # Default features; the js/wasm feature builds are linted implicitly by
      # their test jobs' compiles and are too heavy to duplicate here.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-native:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-native
      # Whole workspace on default features: rs2-core + rs2-server + rs2-cli.
      - run: cargo test --workspace

  test-js:
    name: test (js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-js
      # V8 isolate engine. npm_compat is self-contained; sdk_corpus self-skips
      # when corpus/bundles/ is absent (it is gitignored).
      - run: cargo test -p rs2-core --features js

  # Black-box HTTP conformance (docs/agents/cloudflare.md section F): the
  # same vitest suite against each host. Required for merge from P2 on.
  conformance-rust:
    name: conformance (rust host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/http/package-lock.json
      # The code-store cases deploy a JS bundle, so the host needs V8.
      - run: cargo build -p rs2-server --features js
      - run: npm ci
        working-directory: conformance/http
      - name: Start the Rust host on the fixtures
        working-directory: conformance/http
        env:
          RS2_PORT: "3100"
          RS2_SERVER_BIN: ${{ github.workspace }}/target/debug/rs2-server
        run: |
          node scripts/host-rust.mjs > host.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3100/readyz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "host never became ready"; cat host.log; exit 1
      - run: npx vitest run
        working-directory: conformance/http
        env:
          RS2_PORT: "3100"
          RS2_HOST_KIND: rust
      - name: Host log
        if: always()
        run: cat conformance/http/host.log

  # The Worker host's own unit tests (@cloudflare/vitest-pool-workers) and
  # typecheck (section F.4's worker-unit job).
  worker-unit:
    name: worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rs2-worker/package-lock.json
      - run: npm ci
        working-directory: rs2-worker
      - run: npm run build:shim
        working-directory: rs2-worker
      - run: npm run typecheck
        working-directory: rs2-worker
      - run: npm test
        working-directory: rs2-worker

  conformance-cf:
    name: conformance (cloudflare host)
    runs-on: ubuntu-latest
    # Required for merge alongside conformance-rust from P2 on (section F.4).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: rs2-worker
      - run: npm ci
        working-directory: conformance/http
      # `wrangler dev` with local R2/DO/loader emulation — no account needed.
      - name: Start the Worker host
        working-directory: conformance/http
        env:
          RS2_PORT: "8787"
          RS2_ADMIN_TOKEN: ci
        run: |
          node scripts/host-cf.mjs > host.log 2>&1 &
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8787/readyz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "worker never became ready"; cat host.log; exit 1
      - run: npx vitest run
        working-directory: conformance/http
        env:
          RS2_PORT: "8787"
          RS2_HOST_KIND: cloudflare
          RS2_ADMIN_TOKEN: ci
      - name: Host log
        if: always()
        run: cat conformance/http/host.log

  test-wasm:
    name: test (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-wasm
      - run: rustup target add wasm32-wasip2
      - name: Build conformance guest component
        run: cargo build --manifest-path conformance/echo-guest/Cargo.toml --target wasm32-wasip2 --release
      - name: Point the conformance suite at the guest component
        run: |
          echo "RS2_CONFORMANCE_COMPONENT=${{ github.workspace }}/conformance/echo-guest/target/wasm32-wasip2/release/conformance_echo.wasm" >> "$GITHUB_ENV"
      - run: cargo test -p rs2-core --features wasm
