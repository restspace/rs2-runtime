[package]
name = "rs2-cli"
version = "0.1.0"
edition = "2021"
description = "rs2 — developer CLI: new/dev/test/deploy/migrate (PRD §11, §15)"

[[bin]]
name = "rs2"
path = "src/main.rs"

[dependencies]
rs2-core = { path = "../rs2-core" }
rs2-server = { path = "../rs2-server" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
ureq = "2"
shlex = "1"
mime_guess = "2"

[features]
# Enables the deployment-time component compile check in `rs2 test`.
wasm = ["rs2-core/wasm"]
# Enables the V8 compile check in `rs2 template build` (verifies the bundle
# loads/evaluates as ESM before writing it).
js = ["rs2-core/js"]
