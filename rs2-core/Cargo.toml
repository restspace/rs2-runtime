[package]
name = "rs2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RS2 sandboxed composable-service runtime — core crate (0.x, unstable embedding surface)"

[features]
default = []
# Wasmtime component engine for Rust/Wasm custom services
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
# V8 isolate engine for TS/JS custom services (deno_core: modules, ops, extensions)
js = ["dep:deno_core", "dep:deno_error", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# Outbound HTTP adapter (ureq) for httpOut capability grants
http = ["dep:ureq"]

[dependencies]
argon2 = "0.5"
async-trait.workspace = true
base64 = "0.22"
bcrypt = "0.17"
bumpalo = "3.20.3"
bytes.workspace = true
deno_core = { version = "0.404", optional = true }
deno_error = { version = "0.7", optional = true }
futures.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "0.26", optional = true }
hmac = "0.12"
http.workspace = true
jsonata-rs = "0.3"
jsonschema.workspace = true
percent-encoding.workspace = true
rand = "0.8"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
ureq = { version = "2", optional = true }
uuid.workspace = true
wasmtime = { version = "37", optional = true }
wasmtime-wasi = { version = "37", optional = true }

[dev-dependencies]
hmac = "0.12"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
