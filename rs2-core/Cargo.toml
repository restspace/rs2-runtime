[package]
name = "rs2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RS2 sandboxed composable-service runtime — core crate (0.x, unstable embedding surface)"

[features]
default = []
# Wasmtime component engine for Rust/Wasm custom services
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
# V8 isolate engine for TS/JS custom services (skeleton only in M1)
js = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
jsonschema.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
wasmtime = { version = "37", optional = true }
wasmtime-wasi = { version = "37", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
