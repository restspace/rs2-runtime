[package]
name = "rs2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RS2 sandboxed composable-service runtime — core crate (0.x, unstable embedding surface)"

[features]
default = []
# Wasmtime component engine for Rust/Wasm custom services
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]
# V8 isolate engine for TS/JS custom services (skeleton only in M1)
js = []

[dependencies]
argon2 = "0.5"
async-trait.workspace = true
base64 = "0.22"
bcrypt = "0.17"
bumpalo = "3.20.3"
bytes.workspace = true
futures.workspace = true
hmac = "0.12"
http.workspace = true
jsonata-rs = "0.3"
jsonschema.workspace = true
percent-encoding.workspace = true
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
wasmtime = { version = "37", optional = true }
wasmtime-wasi = { version = "37", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
